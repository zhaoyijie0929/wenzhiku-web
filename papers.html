<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>真题中心 - 军队文职智能报考平台</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="css/design-system.css?v=20260703">
  <link rel="stylesheet" href="css/style.css?v=20260703">
  <style>
    .paper-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 26px;
      flex-wrap: wrap;
    }
    .paper-summary {
      color: var(--text-secondary);
      font-size: 14px;
    }
    .paper-category-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 20px;
      margin-bottom: 32px;
    }
    .paper-category-card {
      background: var(--bg-card);
      border: 1px solid var(--border-default);
      border-radius: var(--radius-md);
      padding: 30px;
      cursor: pointer;
      box-shadow: var(--shadow-sm);
      transition: box-shadow .2s, border-color .2s, transform .2s;
    }
    .paper-category-card:hover {
      border-color: var(--brand-primary);
      box-shadow: var(--shadow-md);
      transform: translateY(-2px);
    }
    .paper-category-title {
      font-size: 20px;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 6px;
    }
    .paper-category-count {
      font-size: 13px;
      color: var(--text-secondary);
    }
    .paper-major-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 14px;
      margin-bottom: 28px;
    }
    .paper-major-card {
      background: var(--bg-card);
      border: 1px solid var(--border-default);
      border-radius: var(--radius-sm);
      padding: 18px 20px;
      cursor: pointer;
      box-shadow: var(--shadow-sm);
      transition: box-shadow .2s, border-color .2s, transform .2s;
    }
    .paper-major-card:hover {
      border-color: var(--brand-primary);
      box-shadow: var(--shadow-md);
      transform: translateY(-1px);
    }
    .paper-major-name {
      font-size: 15px;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 4px;
    }
    .paper-major-count {
      font-size: 12px;
      color: var(--text-secondary);
    }
    .paper-year-section {
      margin-bottom: 28px;
    }
    .paper-year-title {
      font-size: 18px;
      font-weight: 700;
      color: var(--text-primary);
      border-bottom: 1px solid var(--border-default);
      padding-bottom: 12px;
      margin-bottom: 16px;
    }
    .paper-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
      gap: 16px;
    }
    .paper-card {
      background: var(--bg-card);
      border: 1px solid var(--border-default);
      border-radius: var(--radius-sm);
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: var(--shadow-sm);
      transition: box-shadow .2s, border-color .2s, transform .2s;
    }
    .paper-card:hover {
      border-color: var(--brand-primary);
      box-shadow: var(--shadow-md);
      transform: translateY(-1px);
    }
    .paper-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--text-primary);
      line-height: 1.45;
    }
    .paper-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .paper-tag {
      display: inline-flex;
      align-items: center;
      padding: 3px 9px;
      border-radius: 999px;
      background: var(--bg-hover);
      color: var(--text-primary);
      font-size: 12px;
      font-weight: 500;
    }
    .paper-tag.primary {
      background: var(--brand-primary-light);
      color: var(--brand-primary);
    }
    .paper-actions {
      display: flex;
      gap: 10px;
      margin-top: auto;
    }
    .paper-actions .btn {
      flex: 1;
    }
    .paper-empty,
    .paper-loading {
      background: var(--bg-card);
      border: 1px solid var(--border-default);
      border-radius: var(--radius-md);
      padding: 48px 24px;
      color: var(--text-tertiary);
      text-align: center;
    }
    .pdf-modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(35, 51, 51, 0.58);
      z-index: 2000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .pdf-modal-overlay.show {
      display: flex;
    }
    .pdf-modal {
      width: min(1100px, 100%);
      height: min(88vh, 900px);
      background: var(--bg-card);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-lg);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .pdf-modal-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border-default);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
    }
    .pdf-modal-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--text-primary);
      line-height: 1.4;
    }
    .pdf-modal-close {
      width: 32px;
      height: 32px;
      border: none;
      border-radius: 12px;
      background: var(--bg-hover);
      color: var(--text-secondary);
      font-size: 22px;
      line-height: 1;
      cursor: pointer;
    }
    .pdf-modal-close:hover {
      background: var(--brand-primary-light);
      color: var(--brand-primary);
    }
    .pdf-frame {
      width: 100%;
      flex: 1;
      border: none;
      background: var(--bg-hover);
    }
    body { background: #FAFBFC; }
    .main {
      max-width: 1200px;
      padding: 32px 24px 72px;
    }
    .papers-hero {
      min-height: 200px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 420px;
      gap: 32px;
      align-items: center;
      margin-bottom: 24px;
      padding: 22px 26px;
      border: 1px solid #E5E7EB;
      border-radius: 16px;
      background: #FFFFFF;
      box-shadow: 0 8px 30px rgba(15,23,42,.06);
    }
    .papers-hero h1 {
      margin: 16px 0 12px;
      color: #111827;
      font-size: 32px;
      line-height: 1.2;
      font-weight: 900;
    }
    .papers-hero p {
      max-width: 560px;
      margin: 0;
      color: #6B7280;
      font-size: 15px;
      line-height: 1.8;
    }
    .papers-feature-list {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 22px;
    }
    .papers-feature-list span {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 34px;
      padding: 0 12px;
      border-radius: 999px;
      background: #EFF6FF;
      color: #2563EB;
      font-size: 13px;
      font-weight: 800;
    }
    .papers-feature-list span::before {
      content: "";
      width: 14px;
      height: 14px;
      border-radius: 999px;
      background: #2563EB;
      box-shadow: inset 0 0 0 4px #DBEAFE;
    }
    .papers-stats {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
      margin-top: 0;
    }
    .papers-stats div,
    .paper-section,
    .paper-category-card,
    .paper-major-card,
    .paper-card,
    .paper-advice-card,
    .paper-reserved-card {
      border: 1px solid #E5E7EB;
      border-radius: 16px;
      background: #FFFFFF;
      box-shadow: 0 8px 30px rgba(15,23,42,.06);
    }
    .papers-stats div {
      min-height: 88px;
      padding: 16px;
      background: #F8FAFC;
    }
    .papers-stats span {
      display: block;
      margin-bottom: 8px;
      color: #6B7280;
      font-size: 12px;
      font-weight: 700;
    }
    .papers-stats strong {
      color: #2563EB;
      font-size: 22px;
      font-weight: 900;
    }
    .papers-stats .skeleton {
      display: block;
      width: 72px;
      height: 28px;
      border-radius: 16px;
      background: linear-gradient(90deg, #E5E7EB 0%, #F3F4F6 48%, #E5E7EB 100%);
      background-size: 180% 100%;
      animation: paperSkeleton 1.2s ease-in-out infinite;
    }
    @keyframes paperSkeleton {
      0% { background-position: 100% 0; }
      100% { background-position: 0 0; }
    }
    .paper-search-panel {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 104px 104px;
      gap: 12px;
      align-items: center;
      margin-bottom: 20px;
      padding: 14px;
      border: 1px solid #E5E7EB;
      border-radius: 16px;
      background: #FFFFFF;
      box-shadow: 0 8px 30px rgba(15,23,42,.06);
    }
    .answer-card-guide {
      margin-bottom: 20px;
      padding: 18px;
      border: 1px solid #E5E7EB;
      border-radius: 16px;
      background: #FFFFFF;
      box-shadow: 0 8px 30px rgba(15,23,42,.06);
    }
    .answer-card-guide-head {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 16px;
    }
    .answer-card-guide h2 {
      margin: 0;
      color: #111827;
      font-size: 22px;
      font-weight: 900;
    }
    .answer-card-guide-note {
      color: #6B7280;
      font-size: 13px;
    }
    .answer-card-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
    }
    .answer-card-item {
      display: flex;
      flex-direction: column;
      min-height: 250px;
      border: 1px solid #E5E7EB;
      border-radius: 16px;
      overflow: hidden;
      background: #FFFFFF;
      text-decoration: none;
      transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease;
    }
    .answer-card-item:hover {
      transform: translateY(-2px);
      border-color: #BFDBFE;
      box-shadow: 0 12px 30px rgba(15,23,42,.08);
    }
    .answer-card-item img {
      width: 100%;
      height: 160px;
      object-fit: contain;
      background: #F8FAFC;
      border-bottom: 1px solid #E5E7EB;
    }
    .answer-card-item strong {
      padding: 14px 14px 6px;
      color: #111827;
      font-size: 15px;
      line-height: 1.4;
      font-weight: 900;
    }
    .answer-card-item span {
      padding: 0 14px 14px;
      color: #6B7280;
      font-size: 13px;
      line-height: 1.5;
    }
    .paper-search-box {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 42px;
      padding: 0 14px;
      border: 1px solid #E5E7EB;
      border-radius: 12px;
      background: #F8FAFC;
      color: #6B7280;
    }
    .paper-search-box svg {
      width: 18px;
      height: 18px;
      flex: 0 0 auto;
      color: #2563EB;
    }
    .paper-search-box input {
      width: 100%;
      border: 0;
      outline: 0;
      background: transparent;
      color: #111827;
      font-size: 14px;
    }
    .paper-search-box input::placeholder {
      color: #9CA3AF;
    }
    .paper-toolbar {
      display: none;
    }
    .paper-section {
      margin-bottom: 16px;
      padding: 14px;
    }
    .paper-section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 18px;
    }
    .paper-section-title {
      margin: 0;
      color: #111827;
      font-size: 20px;
      font-weight: 900;
    }
    .paper-section-note {
      color: #6B7280;
      font-size: 13px;
    }
    .paper-category-grid {
      gap: 16px;
      margin-bottom: 0;
    }
    .paper-category-card {
      min-height: 96px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 72px;
      gap: 20px;
      align-items: center;
      padding: 16px;
      box-shadow: none;
      cursor: pointer;
    }
    .paper-category-card:hover,
    .paper-major-card:hover,
    .paper-card:hover {
      border-color: #BFDBFE;
      transform: translateY(-2px);
    }
    .paper-category-icon,
    .paper-file-icon {
      display: grid;
      place-items: center;
      border-radius: 16px;
      background: #EFF6FF;
      color: #2563EB;
      font-weight: 900;
    }
    .paper-category-icon {
      width: 52px;
      height: 52px;
    }
    .paper-category-title {
      margin-bottom: 8px;
      font-size: 20px;
      font-weight: 900;
    }
    .paper-category-count {
      color: #2563EB;
      font-size: 24px;
      font-weight: 900;
      line-height: 1;
    }
    .paper-category-desc {
      margin-top: 8px;
      color: #6B7280;
      font-size: 13px;
      line-height: 1.5;
    }
    .paper-card-action {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 32px;
      margin-top: 12px;
      padding: 0 14px;
      border-radius: 12px;
      background: #2563EB;
      color: #FFFFFF;
      font-size: 13px;
      font-weight: 900;
    }
    .paper-major-grid {
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 0;
    }
    .paper-major-card {
      min-height: 74px;
      padding: 14px;
      box-shadow: none;
    }
    .paper-major-name {
      font-size: 15px;
      font-weight: 900;
    }
    .paper-major-count {
      color: #2563EB;
      font-size: 13px;
      font-weight: 800;
    }
    .paper-major-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 10px;
    }
    .paper-major-meta span {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      padding: 0 8px;
      border-radius: 999px;
      background: #F3F4F6;
      color: #6B7280;
      font-size: 11px;
      font-weight: 800;
    }
    .paper-year-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }
    .paper-year-tab {
      min-height: 38px;
      padding: 0 16px;
      border: 1px solid #E5E7EB;
      border-radius: 12px;
      background: #FFFFFF;
      color: #111827;
      font-weight: 800;
      cursor: pointer;
    }
    .paper-year-tab.active {
      border-color: #2563EB;
      background: #EFF6FF;
      color: #2563EB;
    }
    .paper-list {
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
    }
    .paper-card {
      min-height: 168px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      align-items: stretch;
      padding: 18px;
      box-shadow: none;
    }
    .paper-file-icon {
      width: 56px;
      height: 56px;
      font-size: 15px;
    }
    .paper-title {
      margin-bottom: 10px;
      font-size: 16px;
      font-weight: 900;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .paper-card-head {
      display: flex;
      gap: 14px;
      align-items: flex-start;
    }
    .paper-card-body {
      min-width: 0;
    }
    .paper-side-meta {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      color: #6B7280;
      font-size: 12px;
    }
    .paper-actions {
      margin-top: 10px;
    }
    .paper-actions .btn {
      min-height: 34px;
      border-radius: 10px;
    }
    .paper-shell {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 270px;
      gap: 18px;
      align-items: start;
    }
    .paper-list-frame {
      max-height: 200px;
      overflow-y: auto;
      padding-right: 6px;
      scrollbar-width: thin;
      scrollbar-color: #BFDBFE #F8FAFC;
    }
    .paper-list-frame::-webkit-scrollbar {
      width: 8px;
    }
    .paper-list-frame::-webkit-scrollbar-track {
      background: #F8FAFC;
      border-radius: 999px;
    }
    .paper-list-frame::-webkit-scrollbar-thumb {
      background: #BFDBFE;
      border-radius: 999px;
    }
    .paper-side-panel {
      display: grid;
      gap: 14px;
      position: sticky;
      top: 84px;
    }
    .paper-side-card {
      padding: 14px;
      border: 1px solid #E5E7EB;
      border-radius: 16px;
      background: #FFFFFF;
      box-shadow: 0 8px 30px rgba(15,23,42,.06);
    }
    .paper-side-card h3 {
      margin: 0 0 10px;
      color: #111827;
      font-size: 16px;
      font-weight: 900;
    }
    .paper-stat-list,
    .paper-recent-list {
      display: grid;
      gap: 8px;
      margin: 0;
      padding: 0;
      list-style: none;
    }
    .paper-stat-list li,
    .paper-recent-list li {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      color: #6B7280;
      font-size: 13px;
    }
    .paper-stat-list strong {
      color: #111827;
      font-size: 15px;
      font-weight: 900;
    }
    .paper-recent-list span:first-child {
      min-width: 0;
      color: #111827;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .paper-recent-list span:last-child {
      color: #2563EB;
      font-weight: 800;
      flex: 0 0 auto;
    }
    .paper-empty-state {
      display: grid;
      grid-column: 1 / -1;
      place-items: center;
      gap: 12px;
      min-height: 320px;
      padding: 52px 24px;
      border: 1px solid #E5E7EB;
      border-radius: 16px;
      background: #FFFFFF;
      box-shadow: 0 8px 30px rgba(15,23,42,.06);
      text-align: center;
    }
    .paper-empty-icon {
      display: grid;
      place-items: center;
      width: 64px;
      height: 64px;
      border-radius: 18px;
      background: #EFF6FF;
      color: #2563EB;
      font-weight: 900;
    }
    .paper-empty-state h3 {
      margin: 0;
      color: #111827;
      font-size: 20px;
      font-weight: 900;
    }
    .paper-empty-state p {
      margin: 0;
      color: #6B7280;
      font-size: 14px;
      line-height: 1.8;
    }
    .paper-advice-card {
      padding: 16px 18px;
      background: #EFF6FF;
      border-color: #BFDBFE;
    }
    .paper-advice-layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 300px;
      gap: 14px;
      align-items: stretch;
    }
    .paper-advice-card strong {
      display: block;
      margin-bottom: 8px;
      color: #111827;
      font-size: 18px;
    }
    .paper-advice-card p {
      margin: 0;
      color: #374151;
      font-size: 14px;
      line-height: 1.6;
    }
    .paper-reserved-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
      margin-top: 0;
    }
    .paper-reserved-card {
      display: block;
      padding: 14px 16px;
      background: #FFFFFF;
      border: 1px solid var(--border-default);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-sm);
      color: var(--text-secondary);
      text-decoration: none;
      transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease;
    }
    .paper-reserved-card:hover {
      transform: translateY(-2px);
      border-color: var(--brand-primary);
      box-shadow: var(--shadow-md);
    }
    .paper-reserved-card strong {
      display: block;
      margin-bottom: 5px;
      color: var(--text-primary);
      font-size: 16px;
    }
    @media (max-width: 720px) {
      .main {
        padding: 20px 16px 48px;
      }
      .papers-hero,
      .paper-card,
      .paper-search-panel,
      .paper-shell,
      .paper-list {
        grid-template-columns: 1fr;
      }
      .papers-stats,
      .paper-major-grid,
      .paper-reserved-grid {
        grid-template-columns: 1fr;
      }
      .paper-category-grid {
        grid-template-columns: 1fr;
      }
      .paper-advice-layout {
        grid-template-columns: 1fr;
      }
      .paper-section {
        padding: 18px;
      }
      .paper-side-meta {
        flex-direction: column;
        gap: 6px;
      }
      .paper-actions {
        flex-direction: column;
      }
      .paper-side-panel {
        position: static;
      }
      .answer-card-grid {
        grid-template-columns: 1fr;
      }
    }
    @media (min-width: 721px) and (max-width: 1024px) {
      .papers-hero {
        grid-template-columns: 1fr;
      }
      .papers-stats,
      .paper-major-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
      .paper-search-panel {
        grid-template-columns: 1fr 104px 104px;
      }
      .paper-shell {
        grid-template-columns: 1fr;
      }
      .paper-list {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
      .paper-side-panel {
        position: static;
      }
      .answer-card-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }
  </style>
</head>
<body>
  <!-- Header (loaded from components/header.html) -->
  <div id="site-header"></div>
  <script src="js/header-v2.js?v=20260707"></script>

  <main class="main">
    <section class="papers-hero">
      <div class="papers-hero-copy">
        <div class="breadcrumb"><a href="index.html">首页</a> / <span>真题中心</span></div>
        <h1>历年真题中心</h1>
        <p>覆盖军队文职公共科目及专业课真题资料。支持在线预览、PDF 下载、按年份筛选与专业分类。</p>
        <div class="papers-feature-list" aria-label="真题中心能力">
          <span>在线预览</span>
          <span>PDF 下载</span>
          <span>按年份筛选</span>
          <span>专业分类</span>
        </div>
      </div>
      <div class="papers-stats" id="papers-stats" aria-label="真题中心统计">
        <div><span>真题数量</span><strong class="skeleton"></strong></div>
        <div><span>公共科目</span><strong class="skeleton"></strong></div>
        <div><span>专业课</span><strong class="skeleton"></strong></div>
        <div><span>覆盖年份</span><strong class="skeleton"></strong></div>
      </div>
    </section>

    <section class="answer-card-guide">
      <div class="answer-card-guide-head">
        <h2>答题卡填写规范</h2>
        <span class="answer-card-guide-note">考前先看清楚姓名、考场、座序、准考证号和试卷代码怎么填</span>
      </div>
      <div class="answer-card-grid">
        <a class="answer-card-item" href="assets/prep/answer-card-1.png" target="_blank" rel="noopener">
          <img src="assets/prep/answer-card-1.png" alt="公共科目答题卡填写说明">
          <strong>公共科目答题卡填写说明</strong>
          <span>标注姓名、考场、座序、试卷代码和准考证号填写位置。</span>
        </a>
        <a class="answer-card-item" href="assets/prep/answer-card-2.png" target="_blank" rel="noopener">
          <img src="assets/prep/answer-card-2.png" alt="军队文职招录考试答题卡">
          <strong>军队文职招录考试答题卡</strong>
          <span>了解客观题涂卡区域、填涂样例和注意事项。</span>
        </a>
        <a class="answer-card-item" href="assets/prep/answer-card-3.png" target="_blank" rel="noopener">
          <img src="assets/prep/answer-card-3.png" alt="专业科目模拟答题卡">
          <strong>专业科目模拟答题卡</strong>
          <span>包含客观题和主观题作答区域，提醒不要超出答题范围。</span>
        </a>
      </div>
    </section>

    <section class="paper-search-panel" aria-label="真题搜索">
      <label class="paper-search-box" for="paper-search-input">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="m21 21-4.35-4.35M10.8 18a7.2 7.2 0 1 1 0-14.4 7.2 7.2 0 0 1 0 14.4Z" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <input id="paper-search-input" type="search" placeholder="搜索专业、年份、科目">
      </label>
      <button class="btn btn-primary" type="button">搜索</button>
      <button class="btn btn-outline" type="button">重置</button>
    </section>

    <div class="paper-toolbar">
      <div class="tabs" id="paper-tabs"></div>
      <button class="btn btn-outline btn-sm" type="button" id="paper-back" style="display:none;">返回上一级</button>
    </div>

    <section id="paper-content" class="paper-loading">正在加载真题数据...</section>
  </main>

  <div class="pdf-modal-overlay" id="pdf-modal-overlay">
    <div class="pdf-modal" role="dialog" aria-modal="true" aria-labelledby="pdf-modal-title">
      <div class="pdf-modal-header">
        <div class="pdf-modal-title" id="pdf-modal-title">PDF预览</div>
        <button class="pdf-modal-close" type="button" aria-label="关闭" onclick="closePdfPreview()">&times;</button>
      </div>
      <iframe class="pdf-frame" id="pdf-frame" title="PDF在线预览"></iframe>
    </div>
  </div>

  <footer class="footer">
    军队文职智能报考平台 V2.0 · 真题中心
  </footer>

  <script>
    let allPapers = [];
    let currentPapers = [];
    let currentView = "home";
    let currentMajor = "";
    let currentYear = "全部";

    function escapeHtml(value) {
      const div = document.createElement("div");
      div.textContent = value == null ? "" : String(value);
      return div.innerHTML;
    }

    function byYearDesc(a, b) {
      return Number(b.year || 0) - Number(a.year || 0);
    }

    function groupBy(list, getter) {
      return list.reduce((map, item) => {
        const key = getter(item) || "";
        if (!map.has(key)) map.set(key, []);
        map.get(key).push(item);
        return map;
      }, new Map());
    }

    function getTypePapers(type) {
      return allPapers.filter(paper => paper.type === type);
    }

    function getSubjectParam() {
      return new URLSearchParams(location.search).get("subject") || "";
    }

    function examSubjectUrl(subject) {
      return `guide-exam.html?subject=${encodeURIComponent(subject || "")}`;
    }

    function updateSummary() {
      const publicCount = getTypePapers("公共科目").length;
      const professionalCount = getTypePapers("专业课").length;
      const years = Array.from(new Set(allPapers.map(paper => Number(paper.year)).filter(Boolean))).sort((a, b) => a - b);
      const summary = document.getElementById("paper-summary");
      if (summary) {
        summary.textContent = `共收录 ${allPapers.length} 份真题资料，公共科目 ${publicCount} 份，专业课 ${professionalCount} 份。`;
      }
      document.getElementById("papers-stats").innerHTML = `
        <div><span>真题数量</span><strong>${allPapers.length}</strong></div>
        <div><span>公共科目</span><strong>${publicCount}</strong></div>
        <div><span>专业课</span><strong>${professionalCount}</strong></div>
        <div><span>覆盖年份</span><strong>${years.length ? `${years[0]}-${years[years.length - 1]}` : "加载中"}</strong></div>
      `;
    }

    function renderTabs(activeType) {
      const counts = {
        "公共科目": getTypePapers("公共科目").length,
        "专业课": getTypePapers("专业课").length
      };
      document.getElementById("paper-tabs").innerHTML = ["公共科目", "专业课"].map(type => `
        <button class="tab${activeType === type ? " active" : ""}" type="button" onclick="openType('${type}')">
          ${type}（${counts[type]}）
        </button>
      `).join("");
    }

    function renderHome() {
      currentView = "home";
      currentMajor = "";
      currentYear = "全部";
      renderTabs("");
      document.getElementById("paper-back").style.display = "none";
      const publicCount = getTypePapers("公共科目").length;
      const professionalCount = getTypePapers("专业课").length;
      const hotMajors = getHotMajors();
      currentPapers = [...allPapers];
      document.getElementById("paper-content").className = "";
      document.getElementById("paper-content").innerHTML = `
        <section class="paper-section">
          <div class="paper-section-head">
            <h2 class="paper-section-title">公共科目 / 专业课入口</h2>
            <span class="paper-section-note">支持在线预览与 PDF 下载</span>
          </div>
          <div class="paper-category-grid">
            <article class="paper-category-card" onclick="openType('公共科目')">
              <div>
                <div class="paper-category-title">公共科目</div>
                <div class="paper-category-count">${publicCount}</div>
                <div class="paper-category-desc">覆盖公共科目历年试题，支持在线预览、PDF 下载。</div>
                <span class="paper-card-action">进入公共科目</span>
              </div>
              <div class="paper-category-icon">PDF</div>
            </article>
            <article class="paper-category-card" onclick="openType('专业课')">
              <div>
                <div class="paper-category-title">专业课</div>
                <div class="paper-category-count">${professionalCount}</div>
                <div class="paper-category-desc">按专业科目归档，快速定位对应专业真题，支持在线预览、PDF 下载。</div>
                <span class="paper-card-action">进入专业课</span>
              </div>
              <div class="paper-category-icon">PDF</div>
            </article>
          </div>
        </section>
        <section class="paper-section">
          <div class="paper-section-head">
            <h2 class="paper-section-title">热门专业</h2>
            <span class="paper-section-note">根据 papers.json 动态统计</span>
          </div>
          <div class="paper-major-grid">
            ${hotMajors.map(([major, papers]) => `
              <article class="paper-major-card" onclick="renderMajorPapers('${escapeHtml(major)}')">
                <div class="paper-major-name">${escapeHtml(major)}</div>
                <div class="paper-major-count">${papers.length}份真题</div>
                ${renderMajorMeta(papers)}
              </article>
            `).join("")}
          </div>
        </section>
        ${renderYearFilter(allPapers)}
        ${renderPaperWorkspace(allPapers, "真题列表")}
        ${renderAdvice("全部真题")}
      `;
    }

    function getHotMajors() {
      return Array.from(groupBy(getTypePapers("专业课"), paper => paper.major || paper.subject).entries())
        .sort((a, b) => b[1].length - a[1].length || a[0].localeCompare(b[0], "zh-Hans-CN"))
        .slice(0, 8);
    }

    function renderMajorMeta(papers) {
      const years = Array.from(new Set(papers.map(paper => Number(paper.year)).filter(Boolean))).sort((a, b) => a - b);
      const analysisCount = papers.filter(paper => paper.hasAnalysis).length;
      const yearText = years.length ? `${years[0]}-${years[years.length - 1]}` : "年份待补";
      return `<div class="paper-major-meta">
        <span>${yearText}</span>
        <span>${analysisCount}份有解析</span>
      </div>`;
    }

    function renderYearFilter(papers) {
      const years = Array.from(new Set(papers.map(paper => String(paper.year || "")).filter(Boolean)))
        .sort((a, b) => Number(b) - Number(a));
      return `
        <section class="paper-section">
          <div class="paper-section-head">
            <h2 class="paper-section-title">年份筛选</h2>
            <span class="paper-section-note">点击年份即可切换当前列表</span>
          </div>
          <div class="paper-year-tabs" id="paper-year-tabs">
            <button type="button" class="paper-year-tab active" onclick="filterPapersByYear('全部')">全部</button>
            ${years.map(year => `<button type="button" class="paper-year-tab" onclick="filterPapersByYear('${year}')">${year}</button>`).join("")}
          </div>
        </section>`;
    }

    function filterPapersByYear(year) {
      currentYear = year;
      const source = currentPapers.length ? currentPapers : allPapers;
      const list = year === "全部" ? source : source.filter(paper => String(paper.year) === String(year));
      document.querySelectorAll(".paper-year-tab").forEach(btn => {
        btn.classList.toggle("active", btn.textContent.trim() === String(year));
      });
      const note = document.getElementById("paper-list-note");
      if (note) note.textContent = `${year === "全部" ? "全部年份" : `${year}年`} · ${list.length} 份资料`;
      const container = document.getElementById("paper-list");
      if (container) container.innerHTML = list.length ? list.slice().sort(byYearDesc).map(renderPaperCard).join("") : renderEmptyState("当前年份暂无真题数据");
    }

    function renderPaperWorkspace(papers, title) {
      const sorted = [...papers].sort(byYearDesc);
      return `
        <section class="paper-shell">
          <div class="paper-section">
            <div class="paper-section-head">
              <h2 class="paper-section-title">${escapeHtml(title)}</h2>
              <span class="paper-section-note" id="paper-list-note">全部年份 · ${papers.length} 份资料</span>
            </div>
            <div class="paper-list-frame">
              <div class="paper-list" id="paper-list">
                ${sorted.length ? sorted.map(renderPaperCard).join("") : renderEmptyState("暂无真题数据")}
              </div>
            </div>
          </div>
          ${renderSidePanel(papers)}
        </section>`;
    }

    function getPaperStats(papers) {
      const years = Array.from(new Set(papers.map(paper => Number(paper.year)).filter(Boolean))).sort((a, b) => a - b);
      return {
        total: papers.length,
        publicCount: papers.filter(paper => paper.type === "公共科目").length,
        professionalCount: papers.filter(paper => paper.type === "专业课").length,
        yearRange: years.length ? `${years[0]}-${years[years.length - 1]}` : "暂无"
      };
    }

    function renderSidePanel(papers) {
      const stats = getPaperStats(papers);
      const recent = getRecentPapers(papers, 3);
      return `
        <aside class="paper-side-panel">
          <div class="paper-side-card">
            <h3>学习统计</h3>
            <ul class="paper-stat-list">
              <li><span>总真题</span><strong>${stats.total}</strong></li>
              <li><span>公共科目</span><strong>${stats.publicCount}</strong></li>
              <li><span>专业课</span><strong>${stats.professionalCount}</strong></li>
              <li><span>覆盖年份</span><strong>${stats.yearRange}</strong></li>
            </ul>
          </div>
          <div class="paper-side-card">
            <h3>最近更新</h3>
            <ul class="paper-recent-list">
              ${recent.map(paper => `
                <li><span>${escapeHtml(paper.title)}</span><span>${escapeHtml(paper.year)}年</span></li>
              `).join("")}
            </ul>
          </div>
        </aside>`;
    }

    function getRecentPapers(papers, limit) {
      return [...papers].sort(byYearDesc).slice(0, limit);
    }

    function renderAdvice(scope = "全部真题") {
      const subject = scope === "全部真题" || scope === "公共科目" ? "当前科目" : scope;
      return `
        <section class="paper-section">
          <div class="paper-advice-layout">
            <div class="paper-advice-card">
              <strong>AI备考建议</strong>
              <p>当前浏览：${escapeHtml(subject)}。首次备考建议先完成公共科目真题，熟悉题型与时间分配；再根据专业选择专业课真题，按年份从近到远复盘错题。</p>
            </div>
            <div class="paper-reserved-grid">
              <a class="paper-reserved-card" href="guide-exam.html"><strong>考试大纲</strong><span>查看科目分值与官方大纲</span></a>
            </div>
          </div>
        </section>`;
    }

    function openType(type) {
      if (type === "公共科目") {
        renderPublicPapers();
      } else {
        renderProfessionalMajors();
      }
    }

    function renderPublicPapers() {
      currentView = "public";
      currentMajor = "";
      renderTabs("公共科目");
      document.getElementById("paper-back").style.display = "inline-flex";
      renderPaperGroups(getTypePapers("公共科目"), "公共科目");
    }

    function renderProfessionalMajors() {
      currentView = "majors";
      currentMajor = "";
      currentYear = "全部";
      renderTabs("专业课");
      document.getElementById("paper-back").style.display = "inline-flex";
      const majorGroups = Array.from(groupBy(getTypePapers("专业课"), paper => paper.major || paper.subject).entries())
        .sort((a, b) => a[0].localeCompare(b[0], "zh-Hans-CN"));
      document.getElementById("paper-content").className = "";
      document.getElementById("paper-content").innerHTML = `
        <section class="paper-section">
          <div class="paper-section-head">
            <h2 class="paper-section-title">专业课分类</h2>
            <span class="paper-section-note">按专业进入对应真题列表</span>
          </div>
          <div class="paper-major-grid">
            ${majorGroups.map(([major, papers]) => `
              <article class="paper-major-card" onclick="renderMajorPapers('${escapeHtml(major)}')">
                <div class="paper-major-name">${escapeHtml(major)}</div>
                <div class="paper-major-count">${papers.length} 份真题资料</div>
                ${renderMajorMeta(papers)}
              </article>
            `).join("")}
          </div>
        </section>
      `;
    }

    function renderMajorPapers(major) {
      currentView = "major";
      currentMajor = major;
      currentYear = "全部";
      renderTabs("专业课");
      document.getElementById("paper-back").style.display = "inline-flex";
      const papers = getTypePapers("专业课").filter(paper => (paper.major || paper.subject) === major);
      renderPaperGroups(papers, major);
    }

    function renderPaperGroups(papers, title) {
      const sorted = [...papers].sort(byYearDesc);
      currentYear = "全部";
      currentPapers = sorted;
      document.getElementById("paper-content").className = "";
      document.getElementById("paper-content").innerHTML = `
        ${renderYearFilter(sorted)}
        ${renderPaperWorkspace(sorted, title)}
        ${renderAdvice(title)}
      `;
    }

    function renderPaperCard(paper) {
      const hasAnalysisText = paper.hasAnalysis ? "有解析" : "无解析";
      const subjectName = paper.subject || paper.major || "";
      return `
        <article class="paper-card">
          <div class="paper-card-head">
            <div class="paper-file-icon">PDF</div>
            <div class="paper-card-body">
              <div class="paper-title">${escapeHtml(paper.title)}</div>
              <div class="paper-meta">
                <span class="paper-tag primary">${escapeHtml(paper.type || "真题")}</span>
                <span class="paper-tag">${escapeHtml(paper.year)}年</span>
                <span class="paper-tag">${escapeHtml(paper.subject || paper.major || "科目")}</span>
                <span class="paper-tag">${escapeHtml(hasAnalysisText)}</span>
              </div>
            </div>
          </div>
          <div class="paper-side-meta">
            <span>更新时间：${escapeHtml(paper.year || "未知")}年</span>
            <span>${escapeHtml(paper.size || "PDF")}</span>
          </div>
          <div class="paper-actions">
            <button type="button" class="btn btn-outline btn-sm" onclick="previewPaper(${Number(paper.id)})">在线预览</button>
            ${subjectName ? `<a class="btn btn-outline btn-sm" href="${examSubjectUrl(subjectName)}">查看大纲</a>` : ""}
            <a class="btn btn-primary btn-sm" href="${encodeURI(paper.path)}" download="${escapeHtml(paper.filename || paper.title)}">下载</a>
          </div>
        </article>
      `;
    }

    function renderEmptyState(title) {
      return `
        <div class="paper-empty-state">
          <div class="paper-empty-icon">PDF</div>
          <h3>${escapeHtml(title || "暂无真题数据")}</h3>
          <p>请确认已启动本地服务器，且 data/papers.json 文件存在。</p>
          <button class="btn btn-primary" type="button" onclick="loadPapers()">点击重新加载</button>
        </div>`;
    }

    function previewPaper(id) {
      const paper = allPapers.find(item => Number(item.id) === Number(id));
      if (!paper) return;
      document.getElementById("pdf-modal-title").textContent = paper.title;
      document.getElementById("pdf-frame").src = encodeURI(paper.path);
      document.getElementById("pdf-modal-overlay").classList.add("show");
    }

    function closePdfPreview() {
      document.getElementById("pdf-modal-overlay").classList.remove("show");
      document.getElementById("pdf-frame").src = "";
    }

    function goBack() {
      if (currentView === "major") {
        renderProfessionalMajors();
      } else {
        renderHome();
      }
    }

    async function loadPapers() {
      try {
        const response = await fetch("data/papers.json");
        allPapers = await response.json();
        updateSummary();
        const subject = getSubjectParam();
        if (subject && subject !== "公共科目") {
          renderTabs("专业课");
          document.getElementById("paper-back").style.display = "inline-flex";
          renderMajorPapers(subject);
        } else if (subject === "公共科目") {
          openType("公共科目");
        } else {
          renderHome();
        }
      } catch (error) {
        console.error("[真题中心] papers.json 加载失败:", error);
        document.getElementById("paper-content").className = "";
        document.getElementById("paper-content").innerHTML = renderEmptyState("暂无真题数据");
      }
    }

    document.getElementById("paper-back").addEventListener("click", goBack);
    document.getElementById("pdf-modal-overlay").addEventListener("click", (event) => {
      if (event.target.id === "pdf-modal-overlay") closePdfPreview();
    });
    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape") closePdfPreview();
    });

    loadPapers();
  </script>
</body>
</html>
